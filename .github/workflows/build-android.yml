name: Build Android APK

# Builds a debug APK from the Capacitor Android project.
# Runs on every push to main and can be started manually from the
# GitHub Actions tab. A run will fail until the application source
# code (package.json, capacitor.config.ts, android/) has been
# uploaded — that is expected, not a broken workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Node.js dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build the React/TypeScript app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew assembleDebug --no-daemon
        working-directory: .

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drivepoint-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
