name: Build Android APK

# Builds a debug APK from the Capacitor Android project.
# Runs on every push to main and can be started manually from the
# GitHub Actions tab. A run will fail until the application source
# code (package.json, capacitor.config.ts, android/) has been
# uploaded — that is expected, not a broken workflow.
#
# Tool versions match the DRIVEPOINT 0.1.0 project requirements
# (Node.js 22 per the project README; Capacitor 7 with Java 21).
# The ubuntu runner already includes the Android SDK, so no
# separate SDK setup step is used.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Node.js dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build the React/TypeScript app
        run: npm run build

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drivepoint-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
